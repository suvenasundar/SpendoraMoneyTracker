<div >
    <h2>Template driven forms</h2>
    <form #userForm="ngForm" (ngSubmit)="submitForm(userForm)" style="width: 200px ; padding:20px; background: pink; display: flex; flex-direction:column; justify-content: space-evenly; gap: 5px;">
        <div>
            <label for="name">Name:</label>
            <input type="text" name="name" [(ngModel)]="user.name" required>
        </div>
        <div>
            <label for="">Email:</label>
            <input type="email" name="email" id="email" [(ngModel)]="user.email" required>
        </div>
        <button type="submit" [disabled]="userForm.invalid">submit</button>
    </form>
</div>


<div>

</div>
