<a routerLink="/transactions" class="back">← Back to transactions</a>

<div class="detail"  *ngIf="transaction$ | async as transaction; else notFound">
  <h2>{{ transaction.title }}</h2>
  <p class="amount" [appTypeColor]="transaction.type">{{ transaction | signedAmount }}</p>

  <dl>
    <dt>Type</dt>     <dd>{{ transaction.type | titlecase }}</dd>
    <dt>Category</dt> <dd>{{ transaction.category }}</dd>
    <dt>Date</dt>     <dd>{{ transaction.date | date: 'd MMM y' }}</dd>
  </dl>
  <button class="delete-btn" type="button" (click)="delete(transaction.id)">Delete</button>
</div>

<ng-template #notFound>
  <p class="not-found">Transaction not found.</p>
</ng-template>
